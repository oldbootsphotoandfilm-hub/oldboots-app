<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bastidores · Old Boots</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#454205">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bastidores">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone-192.png">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="preconnect" href="https://oldbootsphotoandfilm-hub.github.io" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<style>
html,body{margin:0;height:100%;background:#2f2d04}
/* enquanto a página carrega pela 1.ª vez: o mesmo fundo da abertura, sem saltos */
#app:empty{position:fixed;inset:0;background:#454205}
#obAtu{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100001;display:none;align-items:center;gap:14px;background:#2b2a07;color:#fff4cf;padding:11px 12px 11px 18px;font:400 14px/1.3 Georgia,serif;box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:calc(100vw - 24px)}
#obAtu.on{display:flex}
#obAtu button{font:600 11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:#fff4cf;color:#2b2a07;border:0;padding:10px 14px;cursor:pointer}
</style>
</head>
<body>
<div id="app" data-ob="bastidores"></div>
<div id="obAtu" role="status"><span style="white-space:nowrap">Versão nova disponível</span><button type="button" onclick="location.reload()">Atualizar</button></div>
<script src="https://oldbootsphotoandfilm-hub.github.io/oldboots-site/carregar.js"></script>
<script>
/* app instalável: guarda a página no telemóvel (abre logo, mesmo com rede fraca) e avisa quando há versão nova */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function () { });
  navigator.serviceWorker.onmessage = function (e) { if (e.data && e.data.tipo === 'nova') document.getElementById('obAtu').classList.add('on'); }; // «onmessage» liga logo a receção
}
</script>
</body>
</html>
